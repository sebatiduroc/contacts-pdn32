window.lancer = async function() {
  const btn = document.getElementById('btn');

  // Vérifier que l'utilisateur est connecté
  const user = auth.currentUser;
  if (!user) {
    log("❌ Vous n'êtes pas connecté. Connectez-vous d'abord sur l'application PdN32 dans un autre onglet du même navigateur.", 'err');
    return;
  }

  btn.disabled = true;
  log(`✅ Connecté en tant que ${user.email}`, 'ok');
  log(`📋 Début de l'import de ${promeneurs.length} fiches…`, 'info');

  let ok = 0, err = 0;
  for (const p of promeneurs) {
    try {
      await addDoc(collection(db, 'promeneurs'), {
        ...p,
        gps: '', lat: '', lng: '',
        uid: null,
        dateMaj: serverTimestamp()
      });
      log(`✅ ${p.nom}`, 'ok');
      ok++;
    } catch(e) {
      log(`❌ ${p.nom} : ${e.message}`, 'err');
      err++;
    }
  }

  log(`─────────────────────`, 'info');
  log(`Import terminé : ${ok} réussies, ${err} erreurs.`, ok === promeneurs.length ? 'ok' : 'err');
  log(`⚠️ Pensez à supprimer ce fichier de votre GitHub !`, 'info');
};
